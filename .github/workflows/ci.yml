name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck · Test · Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Offline test suite
        run: npm run test

      - name: Build bundles
        run: npm run build

      - name: Upload built bundles
        uses: actions/upload-artifact@v4
        with:
          name: dshbuddy-lib-${{ matrix.os }}
          path: |
            lib/index.js
            lib/client.js
          if-no-files-found: error
